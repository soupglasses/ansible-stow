---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible-core: "2.19"
            python: "3.11"
          - ansible-core: "2.20"
            python: "3.12"
          - ansible-core: "2.21"
            python: "3.12"
    env:
      ANSIBLE_CORE_VERSION: "${{ matrix.ansible-core }}"
      PYTHON_VERSION: "${{ matrix.python }}"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4

      - name: Install GNU Stow
        run: sudo apt-get update && sudo apt-get install --yes stow

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@v5

      - name: Run the hk checks
        run: hk check --all
